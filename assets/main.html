<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- title logo -->

    <title>GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="images/github-logo.png" type="images/x-icon">

        <!-- font awesome -->

 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

      <!-- font integration -->

     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

     <!-- daisy ui -->

     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- link css -->

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f6f8fa] font-['Geist'] text-[#1f2328]">
 <header>
   <nav class="bg-[#f6f8fa] border-b px-6 py-3 flex items-center justify-between">

  
  <div class="flex items-center gap-2">
    <img src="images/github-logo.png" class="w-5">
    <h1 class="font-semibold text-lg">GitHub Issues Tracker</h1>
  </div>

 
  <div class="flex items-center gap-3">

    <!-- Search button  -->

    <input 
    type="text" 
    placeholder="Search issues..." 
    class="input input-bordered input-sm w-64">

    
    <button class="btn btn-primary btn-sm">
      + New Issue
    </button>

  </div>

</nav>
 </header>

   
<main class="pb-14">

    <!--  Buttonss -->

    <section class="container mx-auto mt-[60px] px-4">
        <div class="flex flex-col md:flex-row w-full bg-white py-6 px-6 rounded-md shadow-sm gap-2">

            <button id="all" onclick="loadData('all');buttonToggle('all')"
                class="btn-category btn btn-primary w-full md:w-[120px]">
                All
            </button>

            <button id="open" onclick="loadData('open');buttonToggle('open')"
                class="btn-category btn w-full md:w-[120px]">
                Open
            </button>

            <button id="closed" onclick="loadData('closed');buttonToggle('closed')"
                class="btn-category btn w-full md:w-[120px]">
                Closed
            </button>

        </div>
    </section>


    
    <section class="container mx-auto mt-4 px-4">

        <div class="bg-[#FBFBFB]">

            <!-- -->

            <div class="p-6 bg-white rounded-md shadow-sm border-b flex justify-between items-center">

                <div class="flex items-center gap-3">
                    
                    <img class="w-[50px] h-[50px]" src="images/Aperture.png" alt="">

                    <div>
                        <h1 class="text-xl font-semibold text-[#1F2937]">
                            <span id="issueCount">0</span> Issues
                        </h1>

                        <p class="text-lg text-[#64748B] mt-1">
                            Track and manage your project issues
                        </p>
                    </div>
                </div>


                

                <div class="flex gap-4">

                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 rounded-full bg-[#00A96E]"></div>
                        <h1>Open</h1>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 rounded-full bg-[#A855F7]"></div>
                        <h1>Closed</h1>
                    </div>

                </div>

            </div>


            <!-- CardContainer -->

            <div id="card-container"
                class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 bg-[#FBFBFB] shadow-sm">
            </div>



            <div id="spinners" class="flex justify-center items-center min-h-80">
                <span class="loading loading-spinner loading-xl"></span>
            </div>




            <div id="not-found"
                class="hidden flex-col items-center text-center justify-center min-h-80 py-16">

                <h2 class="text-2xl font-semibold text-gray-700">
                    NO Issues Found
                </h2>

                <p class="text-gray-500 text-sm">
                    Try another search or select a different category
                </p>

            </div>

        </div>

    </section>


    <!-- Modal -->

    <section>

        <dialog id="my_modal" class="modal">

            <div class="modal-box">

                <h1 id="title" class="text-2xl font-bold text-[#1F2937]">
                    Fix broken image uploads
                </h1>

                <div class="mt-2 flex gap-2">

                    <button id="status"
                        class="pt-2 pb-2 pl-4 pr-4 bg-[#00A96E] rounded-full text-white">
                        Opened
                    </button>

                    <ul class="list-disc flex ml-6 items-center">

                        <li id="name">Opened by Fahim Ahmed</li>

                        <li id="date" class="ml-8">
                            22/02/2026
                        </li>

                    </ul>

                </div>


                <p id="description" class="text-[#64748B] mt-6 mb-6">
                    The navigation menu doesn't collapse properly on mobile devices.
                </p>


                <div class="modal-action">
                    <form method="dialog">
                        <button class="btn btn-primary">Close</button>
                    </form>
                </div>

            </div>

        </dialog>

    </section>

</main>
      <!-- <script src="main.js"></script> -->
</body>
</html>
