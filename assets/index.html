<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- title logo -->

    <title>GitHub Issues Tracker</title>
    <link rel="shortcut icon" href="images/github-logo.png" type="images/x-icon">

        <!-- font awesome -->

 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

      <!-- font integration -->

     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

     <!-- daisy ui -->

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- link css -->

    <link rel="stylesheet" href="style.css">

</head>



<body class="bg-[#F8FAFC] flex items-center justify-center min-h-screen">

    <!-- card -->

<div class="w-96 bg-white rounded-xl shadow-lg p-5">

  <div class="text-center mb-4">
    <img class="w-16 mx-auto" src="images/github-logo.png" />
    <h2 class="text-2xl font-semibold ">GitHub Issues Tracker</h2>
    <p class="text-sm text-[#64748B]">Sign in to manage your issues</p>
  </div>

  <div class="form-control">
    <label class="label">
      <span class="label-text">Username</span>
    </label>
   <input id="username" type="text" placeholder="Enter Username" class="input input-bordered" />
    <p class="text-xs text-[#4A00FF] mt-1">Default: admin</p>
  </div>

  <div class="form-control mt-4">
    <label class="label">
      <span class="label-text">Password</span>
    </label>
    <input id="passWord" type="password" placeholder="Enter Password" class="input input-bordered" />
    <p class="text-xs text-[#4A00FF] mt-1">Default: admin123</p>
  </div>

  <button id="sign-in" class="btn btn-primary mt-5 w-full">Sign In</button>

  <div class="divider">OR</div>

   <h1 class="text-[#64748B] text-center mb-1">Demo Credentials:</h1>
   <div class="bg-[#F8FAFC] py-3 flex flex-col justify-center items-center">
    
       <p>Username: admin</p>
       <p>Password: admin123</p>
   </div>
    
  </div>

</div>
    <script src="index.js"></script>
</body>
</html>
